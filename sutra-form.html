<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUTRA FORM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* General body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f400;
            margin: 0;
            padding: 20px 0; /* Add top and bottom padding to the body */
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align form at the top initially */
            min-height: 100vh; /* Ensure the body takes at least the full viewport height */
            background-image: url(15.jpg);
        }

        /* Form container styling */
        .form-container {
            background-color: #ffffffa5;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            margin: auto; /* Center the form horizontally */
            position: relative;
            margin-top: 20px; /* Ensure it's not too close to the top */
        }

        /* Logout button styling */
        .logout-button {
            position: absolute;
            top: 10px;
            right: 4px;
            padding: 8px 16px;
            background-color: transparent;
            color: #dc3545;
            border: 1px solid #dc3545;
            border-radius: 5px;
            cursor: pointer;
            font-size: 10px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .logout-button:hover {
            background-color: #dc3545;
            color: #fff;
        }

        /* Form title styling */
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            margin-top: 0;
            font-size: 30px;
            font-family: 'Lora', serif;
        }

        /* Label styling */
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        /* Input field styling */
        input[type="text"],
        input[type="date"],
        input[type="time"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px; /* Uniform font size for all input fields */
            box-sizing: border-box;
            text-transform: uppercase; /* Ensure text is always uppercase */
        }

        /* Read-only input fields */
        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
        }

        /* Select field styling */
        select {
            appearance: none;
            background-color: #fff;
            cursor: pointer;
        }

        /* Button styling */
        button[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* Placeholder for LP and ALP names */
        #lp-name,
        #alp-name {
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }

        /* Ensure the time picker stays within the form container */
        .flatpickr-calendar {
            z-index: 9999; /* Ensures the calendar dropdown appears above other elements */
        }

        /* Media query for smaller devices */
        @media (max-width: 600px) {
            .form-container {
                padding: 15px;
            }

            input[type="text"],
            input[type="date"],
            input[type="time"],
            select,
            button[type="submit"] {
                font-size: 14px; /* Consistent font size */
                padding: 8px;
            }
        }

        /* Welcome message styling */
        #welcome-message {
            font-family: 'Lora', serif;
            text-align: center;
            font-size: 14px;
            color: #545353;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Spinner styling */
        #spinner-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        #spinner {
            width: 50px; /* Adjust size as needed */
            height: 50px;
        }

        .bd {
            background-color: rgba(255, 255, 255, 0); /* Semi-transparent white background */
            padding: 0px 10px; /* Padding around the text */
            border-radius: 4px; /* Rounded corners */
            font-size: 12px; /* Text size */
            color: rgba(0, 32, 174, 0.608); /* Text color */
            position: absolute; /* Positioning relative to the login container */
            bottom: 0px; /* Position it 10px from the bottom of the login container */
            right: 0px; /* Position it 10px from the right side of the login container */
            text-align: center; /* Center align the text */
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- Logout button inside the container -->
        <button class="logout-button" onclick="logout()">LOGOUT</button>
        <!-- Form content -->
        <h2>SUTRA FORM</h2>
        <!-- Welcome message -->
        <h3 id="welcome-message"></h3>
        
        <form id="sutra-form" action="#" method="post" autocomplete="off">
            <label for="lp-id">ENTER LP ID</label>
            <input type="text" id="lp-id" name="lp-id" placeholder="ex. BSP3637" required pattern=".{7,8}" title="LP ID must be like ex.BSP1234" oninput="this.value = this.value.toUpperCase().replace(/\s/g, '')">
            <div id="lp-name"></div>
            <input type="hidden" id="lp-name-hidden" name="lp-name-hidden">
            <input type="hidden" id="lp-mobile-hidden" name="lp-mobile-hidden">

            <label for="alp-id">ENTER ALP ID</label>
            <input type="text" id="alp-id" name="alp-id" placeholder="EX. BSP3637" required pattern=".{7,8}" title="ALP ID must be like ex.BSP1234" oninput="this.value = this.value.toUpperCase().replace(/\s/g, '')">
            <div id="alp-name"></div>
            <input type="hidden" id="alp-name-hidden" name="alp-name-hidden">
            <input type="hidden" id="alp-mobile-hidden" name="alp-mobile-hidden">

            <label for="train-no">TRAIN NO.</label>
            <input type="text" id="train-no" name="train-no" required>

            <label for="loco-no">LOCO NO.</label>
            <input type="text" id="loco-no" name="loco-no" required>

            <label for="sign-on-date">SIGN ON DATE</label>
            <input type="date" id="sign-on-date" name="sign-on-date" required>

            <label for="sign-on-time">SIGN ON TIME</label>
            <input type="text" id="sign-on-time" name="sign-on-time" required>

            <label for="direction">SELECT DIRECTION</label>
            <select id="direction" name="direction" required>
                <option value="" disabled selected>SELECT</option>
                <option value="UP">UP</option>
                <option value="DN">DN</option>
                <option value="UP CIC">UP CIC</option>
                <option value="DN CIC">DN CIC</option>
            </select>

            <label for="last-passed-station">LAST PASSED STATION CODE</label>
            <input type="text" id="last-passed-station" name="last-passed-station" required oninput="this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4)">

            <label for="ml-cic">TLC ML/CIC</label>
            <select id="ml-cic" name="ml-cic" required>
                <option value="" disabled selected>SELECT</option>
                <option value="BSP-CPH-DIPKA">BSP-CPH-DIPKA</option>
                <option value="SGRD-RIG-JSG">SGRD-RIG-JSG</option>
                <option value="CIC">CIC</option>
            </select>
            <input type="hidden" id="timestamp" name="timestamp">
            <button type="submit">SUBMIT</button>
        </form>
        <div class="bd">BILASPUR DIVISION</div>
    </div>
    <!-- Spinner Container -->
    <div id="spinner-container" style="display:none;">
        <img src="spinner.gif" alt="Loading..." id="spinner">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        // Check if user is logged in
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            // If not logged in, redirect to the login page
            window.location.href = 'sutra-login.html';
        }

        // Function to handle logout
        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            window.location.href = 'sutra-login.html'; // Redirect to login page after logout
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Function to fetch names and mobile numbers from the CSV file
            async function fetchNames() {
                const response = await fetch('https://docs.google.com/spreadsheets/d/1W3OwBoptpvnL_dSohSZn4elnrIwTn2nanEEpBUsjiSU/pub?output=csv');
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(','));
                return rows.reduce((acc, [id, name, password, mobile]) => {
                    acc[id.toUpperCase()] = { name, mobile };
                    return acc;
                }, {});
            }

            // Store names and mobile numbers in a variable for quick access
            let nameLookup = {};

            // Load names and mobile numbers on page load
            fetchNames().then(data => {
                nameLookup = data;
            });

            // Function to handle ID input and display name or error message
            function handleIdInput(id, nameElementId, nameHiddenElementId, mobileHiddenElementId) {
                const info = nameLookup[id] || {};
                const name = info.name || 'PLEASE CHECK ID';
                const mobile = info.mobile || '';
                document.getElementById(nameElementId).textContent = name !== 'PLEASE CHECK ID' ? `Name: ${name}` : name;
                document.getElementById(nameHiddenElementId).value = name !== 'PLEASE CHECK ID' ? name : '';
                document.getElementById(mobileHiddenElementId).value = name !== 'PLEASE CHECK ID' ? mobile : '';
            }

            // Event listener for LP ID input
            document.getElementById("lp-id").addEventListener("input", function() {
                const id = this.value.toUpperCase();
                handleIdInput(id, "lp-name", "lp-name-hidden", "lp-mobile-hidden");
            });

            // Event listener for ALP ID input
            document.getElementById("alp-id").addEventListener("input", function() {
                const id = this.value.toUpperCase();
                handleIdInput(id, "alp-name", "alp-name-hidden", "alp-mobile-hidden");
            });

            // Get current date and yesterday's date for restrictions
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);

            // Format dates as YYYY-MM-DD for Flatpickr
            const formatDate = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            // Initialize Flatpickr for the date input
            flatpickr("#sign-on-date", {
                dateFormat: "Y-m-d",
                minDate: formatDate(yesterday),
                maxDate: formatDate(today),
                defaultDate: formatDate(today)
            });

            // Initialize Flatpickr for the time input with dynamic maxTime
            const signOnTimePicker = flatpickr("#sign-on-time", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i",
                time_24hr: true
            });

            // Update maxTime for sign-on-time based on selected date
            document.getElementById("sign-on-date").addEventListener("change", function() {
                const selectedDate = new Date(this.value);
                const todayFormatted = formatDate(today);
                const selectedDateFormatted = formatDate(selectedDate);

                if (selectedDateFormatted === todayFormatted) {
                    // If today is selected, restrict time to current time
                    const currentHours = String(today.getHours()).padStart(2, '0');
                    const currentMinutes = String(today.getMinutes()).padStart(2, '0');
                    signOnTimePicker.set("maxTime", `${currentHours}:${currentMinutes}`);
                } else {
                    // If yesterday is selected, allow any time up to 23:59
                    signOnTimePicker.set("maxTime", "23:59");
                }
            });

            // Trigger the change event on page load to set initial time restrictions
            const signOnDateInput = document.getElementById("sign-on-date");
            if (signOnDateInput.value === formatDate(today)) {
                const currentHours = String(today.getHours()).padStart(2, '0');
                const currentMinutes = String(today.getMinutes()).padStart(2, '0');
                signOnTimePicker.set("maxTime", `${currentHours}:${currentMinutes}`);
            }

            // Display the welcome message with the user's name below the SUTRA FORM heading
            const userName = sessionStorage.getItem('userName');
            if (userName) {
                const welcomeElement = document.createElement('div');
                welcomeElement.id = 'welcome-message';
                welcomeElement.style.textAlign = 'center';
                welcomeElement.style.marginBottom = '20px';
                welcomeElement.style.fontWeight = 'bold';
                welcomeElement.innerText = `Welcome ${userName}`;
                const formContainer = document.querySelector('.form-container');
                const sutraFormHeading = formContainer.querySelector('h2');
                sutraFormHeading.insertAdjacentElement('afterend', welcomeElement);
            }

            // Function to convert form data to uppercase
            function convertFormDataToUpperCase(formData) {
                const newFormData = new FormData();
                formData.forEach((value, key) => {
                    newFormData.append(key, value.toUpperCase());
                });
                return newFormData;
            }

            // Form submission logic
            document.getElementById("sutra-form").addEventListener("submit", function(e) {
                e.preventDefault();
            
                // Get the values of the date and time fields
                const signOnDate = document.getElementById("sign-on-date").value;
                const signOnTimeInput = document.getElementById("sign-on-time").value;

                // fetch properly name and number of LP and ALP
                const lpName = document.getElementById("lp-name-hidden").value;
                const alpName = document.getElementById("alp-name-hidden").value;
                console.log("LP Name:", lpName);
                console.log("ALP Name:", alpName);
            
                // Combine date and time into the desired format
                const formattedSignOnDateTime = formatDateTime(signOnDate, signOnTimeInput);

                // Log the formatted date-time value for debugging
                console.log("Formatted Sign-On DateTime:", formattedSignOnDateTime);
                
                // Update the value of the sign-on-time input to include both date and time
                document.getElementById("sign-on-time").value = formattedSignOnDateTime;
            
                // Capture current timestamp in the required format
                const currentTimestamp = formatTimestamp(new Date());
                document.getElementById("timestamp").value = currentTimestamp;
            
                // Proceed with form submission
                const formData = new FormData(e.target);
                const uppercaseFormData = convertFormDataToUpperCase(formData);
            
                const submitButton = e.target.querySelector('button[type="submit"]');
                const spinnerContainer = document.getElementById("spinner-container");
            
                // Show the spinner
                spinnerContainer.style.display = "block";
            
                // Disable the submit button
                submitButton.disabled = true;
            
                fetch('https://script.google.com/macros/s/AKfycbzj6q4tr9DtNqpFIAZGIKPXTHkV1FC5X-dVOXPS7aW-XoeDuuymjylBJpDVVIKnfo8U5g/exec', {
                    method: 'POST',
                    body: uppercaseFormData
                })
                .then(response => response.json())
                .then(data => {
                    // Hide the spinner
                    spinnerContainer.style.display = "none";
            
                    if (data.result === 'success') {
                        if (confirm('Form submitted successfully! Click OK to go to the homepage.')) {
                            window.location.href = 'index.html';
                        }
                    } else {
                        // Re-enable the submit button and show error message
                        submitButton.disabled = false;
                        document.getElementById("message").textContent = `Error: ${data.error}`;
                    }
                })
                .catch(error => {
                    spinnerContainer.style.display = "none";
                    submitButton.disabled = false;
                    document.getElementById("message").textContent = "Error submitting form.";
                    console.error("Error:", error);
                });
            });
            
            // Function to format the date and time as "DD/MM/YYYY HH:MM:SS"
            function formatDateTime(date, time) {
                // Check if time already contains a date component (e.g., "DD/MM/YYYY HH:MM")
                if (time.includes('/')) {
                    // Extract only the time part (HH:MM or HH:MM:SS)
                    const timeParts = time.split(' ')[1] || time;
                    time = timeParts.includes(':') ? timeParts : timeParts + ':00';
                }
                
                // Ensure time has seconds (HH:MM:SS)
                if (time.length === 5) { // If time is in "HH:MM" format
                    time += ":00"; // Add seconds
                }
                
                // Parse date (YYYY-MM-DD) to DD/MM/YYYY
                const [year, month, day] = date.split("-");
                return `${day}/${month}/${year} ${time}`; // Format: "DD/MM/YYYY HH:MM:SS"
            }
            
            // Function to format the timestamp as "DD/MM/YYYY HH:MM:SS"
            function formatTimestamp(date) {
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are 0-based
                const year = date.getFullYear();
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const seconds = String(date.getSeconds()).padStart(2, '0');
            
                return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
            }
            
            // Function to handle logout
            document.querySelector('.logout-button').addEventListener('click', function() {
                sessionStorage.removeItem('isLoggedIn');
                sessionStorage.removeItem('userId');
                sessionStorage.removeItem('userName');
                window.location.href = 'sutra-login.html'; // Redirect to login page after logout
            });
        });
    </script>
</body>
</html>
