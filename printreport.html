<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Long Hours Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #e6f0fa;
        }
        .container {
            max-width: 1200px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            margin-right: 10px;
            font-weight: 600;
        }
        input[type="datetime-local"], select, input[type="text"] {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        select {
            width: 200px;
        }
        .checkbox-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }
        .checkbox-container label {
            font-size: 14px;
            margin-right: 5px;
        }
        .button-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .action-button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
            background-color: #28a745;
            color: white;
        }
        .action-button:hover {
            background-color: #218838;
        }
        .action-button#generate-button {
            background-color: #007bff;
        }
        .action-button#generate-button:hover {
            background-color: #0056b3;
        }
        .delete-cross {
            color: #d32f2f;
            font-size: 16px;
            cursor: pointer;
            display: inline-block;
            padding: 2px 5px;
        }
        .delete-cross:hover {
            color: #b71c1c;
        }
        #report {
            margin-top: 20px;
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #333333;
            padding: 6px;
            text-align: left;
            font-size: 12px;
            white-space: normal;
            word-wrap: break-word;
        }
        th {
            background-color: #b3d7ff;
            color: #003087;
        }
        tbody tr:nth-child(even) {
            background-color: #ffffff;
        }
        tbody tr:nth-child(odd) {
            background-color: #ffffff;
        }
        th:nth-child(1), td:nth-child(1) { width: 12%; } /* ML/CIC */
        th:nth-child(2), td:nth-child(2) { width: 10%; } /* LP ID */
        th:nth-child(3), td:nth-child(3) { width: 12%; } /* LP Name */
        th:nth-child(4), td:nth-child(4) { width: 12%; } /* ALP Name */
        th:nth-child(5), td:nth-child(5) { width: 14%; } /* Sign On Time */
        th:nth-child(6), td:nth-child(6) { width: 12%; } /* Train No */
        th:nth-child(7), td:nth-child(7) { width: 12%; } /* LOCO No */
        th:nth-child(8), td:nth-child(8) { width: 10%; } /* Last Passed Station */
        th:nth-child(9), td:nth-child(9) { width: 14%; } /* Crew Entry Time */
        th:nth-child(10), td:nth-child(10) { width: 10%; } /* Total Duty Hours */
        th:nth-child(11), td:nth-child(11) { width: 2%; } /* Action */
        .error {
            color: #d32f2f;
            margin-top: 10px;
            font-weight: bold;
        }
        #tlcDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 1000;
            width: 300px;
        }
        #tlcDialog h3 {
            margin: 0 0 15px;
            font-size: 18px;
        }
        #tlcDialog .input-group {
            margin-bottom: 10px;
        }
        #tlcDialog input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }
        #tlcDialog .dialog-buttons {
            text-align: right;
        }
        #tlcDialog .close-dialog {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #d32f2f;
            cursor: pointer;
            font-size: 16px;
        }
        #tlcDialog .close-dialog:hover {
            color: #b71c1c;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        @media print {
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            .container, .checkbox-container, .button-container, .input-group, button, .delete-cross, #tlcDialog, #overlay {
                display: none;
            }
            #report {
                display: block;
                width: 21cm;
                margin: 0;
                padding: 0.5cm;
                box-sizing: border-box;
                font-size: 7pt;
                page-break-after: always;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th, td {
                border: 1px solid #333333;
                padding: 3px;
                font-size: 7pt;
            }
            th {
                background-color: #b3d7ff;
                color: #003087;
            }
            tbody tr:nth-child(even) {
                background-color: #ffffff;
            }
            tbody tr:nth-child(odd) {
                background-color: #ffffff;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div id="overlay"></div>
    <div id="tlcDialog">
        <span class="close-dialog" onclick="closeTlcDialog()">✖</span>
        <h3>Enter TLC Details</h3>
        <div class="input-group">
            <label for="tlcNameInput">Enter TLC Name:</label>
            <input type="text" id="tlcNameInput" placeholder="TLC Name" required>
        </div>
        <div class="input-group">
            <label for="tlcPhoneInput">Enter Phone Number:</label>
            <input type="text" id="tlcPhoneInput" placeholder="Phone Number">
        </div>
        <div class="dialog-buttons">
            <button class="action-button" onclick="submitTlcDetails()">Submit</button>
        </div>
    </div>
    <div class="container">
        <h2 style="color: #003087;">Access Long Hours Memo Generator</h2>
        <div class="input-group">
            <label for="tlcName">Select TLC Name:</label>
            <select id="tlcName" onchange="handleTlcChange()">
                <option value="" disabled selected>Select TLC Name</option>
            </select>
        </div>
        <div class="input-group">
            <label for="fromDateTime">From Date and Time:</label>
            <input type="datetime-local" id="fromDateTime" required>
        </div>
        <div class="input-group">
            <label for="toDateTime">To Date and Time:</label>
            <input type="datetime-local" id="toDateTime" required>
        </div>
        <div class="checkbox-container">
            <label><input type="checkbox" id="mainLineCheckbox" checked> Main Line Report</label>
            <label><input type="checkbox" id="cicCheckbox" checked> CIC Report</label>
        </div>
        <div class="button-container">
            <button class="action-button" id="generate-button" onclick="generateReport()">Generate Report</button>
            <button class="action-button" onclick="printReport()">Print</button>
        </div>
        <div id="error" class="error"></div>
        <div id="report"></div>
    </div>

    <script>
        const API_KEY = 'AIzaSyB8c518fLKJvJhCLtN_JlHFNFCb5WSy-5s';
        const SHEET_ID = '1Eob3yiujIi0sNtsPQr_HCvQtlybXnq6K11bm1wAcqAo';
        const SHEET_NAME = 'input';
        const LOG_SHEET_ID = '17NHyH22pKTK0qHYhF5nYpYdl3WivxVgoQLqxtVgjQZg';
        const LOG_SHEET_NAME = 'Sheet1';
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz6WKmGYY8Ko0DsPXw-Y6udiu1rt8p56EDjys4w0ErfkrMVtUF8AxYSm_0OKm6l8s_doA/exec';
        let filteredRows = [];
        let selectedTlcName = '';
        let tlcData = {};

        async function populateTlcDropdown() {
            try {
                console.log('Fetching TLC.csv...');
                const response = await fetch('TLC.csv');
                if (!response.ok) {
                    throw new Error(`Failed to fetch TLC.csv: ${response.statusText}`);
                }
                const tlcCsv = await response.text();
                const tlcSelect = document.getElementById('tlcName');
                const rows = tlcCsv.split('\n').slice(1);
                rows.forEach(row => {
                    if (row.trim()) {
                        const [name, mobile] = row.split(',');
                        tlcData[name] = mobile || '';
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name;
                        tlcSelect.appendChild(option);
                    }
                });
                const otherOption = document.createElement('option');
                otherOption.value = 'Other';
                otherOption.textContent = 'Other';
                tlcSelect.appendChild(otherOption);
                console.log('TLC dropdown populated successfully', tlcData);
            } catch (error) {
                console.error('Error fetching TLC.csv:', error);
                document.getElementById('error').innerText = 'Failed to load TLC names: ' + error.message;
            }
        }

        function handleTlcChange() {
            const tlcSelect = document.getElementById('tlcName');
            const value = tlcSelect.value;
            if (value === 'Other') {
                showTlcDialog();
            } else {
                selectedTlcName = value;
            }
        }

        function showTlcDialog() {
            document.getElementById('tlcDialog').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('tlcNameInput').value = '';
            document.getElementById('tlcPhoneInput').value = '';
        }

        function closeTlcDialog(canceled = false) {
            document.getElementById('tlcDialog').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            const tlcSelect = document.getElementById('tlcName');
            if (canceled) {
                tlcSelect.value = ''; // Reset only if dialog is canceled
            }
        }

        function submitTlcDetails() {
            const nameInput = document.getElementById('tlcNameInput').value.trim();
            const phoneInput = document.getElementById('tlcPhoneInput').value.trim();
            if (!nameInput) {
                alert('Please enter a TLC Name.');
                return;
            }
            selectedTlcName = nameInput;
            tlcData[nameInput] = phoneInput;
            const tlcSelect = document.getElementById('tlcName');
            let customOption = tlcSelect.querySelector(`option[value="${nameInput}"]`);
            if (!customOption) {
                customOption = document.createElement('option');
                customOption.value = nameInput;
                customOption.textContent = nameInput;
                const otherOption = tlcSelect.querySelector('option[value="Other"]');
                tlcSelect.insertBefore(customOption, otherOption);
            }
            tlcSelect.value = nameInput;
            closeTlcDialog();
        }

        function parseCustomDate(dateStr) {
            if (!dateStr) {
                console.warn('Empty date string:', dateStr);
                return null;
            }
            try {
                const [datePart, timePart] = dateStr.split(' ');
                if (!datePart || !timePart) {
                    console.warn('Invalid date format (missing date or time):', dateStr);
                    return null;
                }
                const [day, month, year] = datePart.split('/').map(Number);
                const [hours, minutes, seconds] = timePart.split(':').map(Number);
                if (isNaN(day) || isNaN(month) || isNaN(year) || isNaN(hours) || isNaN(minutes) || isNaN(seconds)) {
                    console.warn('Invalid date components:', { dateStr, day, month, year, hours, minutes, seconds });
                    return null;
                }
                const date = new Date(year, month - 1, day, hours, minutes, seconds);
                if (isNaN(date)) {
                    console.warn('Invalid date created:', dateStr);
                    return null;
                }
                return date;
            } catch (error) {
                console.error('Error parsing date:', dateStr, error);
                return null;
            }
        }

        function formatDate24(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
        }

        function calculateDutyHours(signOnTime) {
            if (!signOnTime) {
                console.warn('Missing signOnTime:', { signOnTime });
                return 0;
            }
            try {
                const signOnDateTime = parseCustomDate(signOnTime);
                if (!signOnDateTime) {
                    console.warn('Invalid signOnTime:', { signOnTime });
                    return 0;
                }
                const currentDateTime = new Date();
                const diffMs = currentDateTime - signOnDateTime;
                const diffHours = diffMs / (1000 * 60 * 60);
                return diffHours > 0 ? diffHours : 0;
            } catch (error) {
                console.error('Error calculating duty hours:', { signOnTime, error });
                return 0;
            }
        }

        function formatDutyHours(hours) {
            if (!hours || hours <= 0) return '00:00';
            const wholeHours = Math.floor(hours);
            const minutes = Math.round((hours - wholeHours) * 60);
            return `${String(wholeHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        async function fetchSheetData() {
            try {
                console.log('Fetching data from Google Sheet...');
                const response = await fetch(
                    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${SHEET_NAME}!A:W?key=${API_KEY}`
                );
                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }
                console.log('Data fetched successfully:', {
                    rowCount: data.values.length,
                    sampleRows: data.values.slice(0, 5)
                });
                return data.values || [];
            } catch (error) {
                const errorMsg = 'Error fetching sheet data: ' + error.message;
                document.getElementById('error').innerText = errorMsg;
                console.error(errorMsg, error);
                return [];
            }
        }

        function appendToSheet(timestamp, tlcName, tlcMobile, fromDateTime, toDateTime) {
            return new Promise((resolve, reject) => {
                try {
                    console.log('Appending data to Google Sheet:', { timestamp, tlcName, tlcMobile, fromDateTime, toDateTime });
                    
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.name = 'hiddenIframe';
                    document.body.appendChild(iframe);

                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = WEB_APP_URL;
                    form.target = 'hiddenIframe';
                    form.style.display = 'none';

                    const fields = { timestamp, tlcName, tlcMobile, fromDateTime, toDateTime };
                    for (const [key, value] of Object.entries(fields)) {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = key;
                        input.value = value || '';
                        form.appendChild(input);
                    }

                    document.body.appendChild(form);
                    form.submit();

                    setTimeout(() => {
                        document.body.removeChild(form);
                        document.body.removeChild(iframe);
                        console.log('Form submitted to Google Sheet via iframe');
                        resolve();
                    }, 1000);
                } catch (error) {
                    console.error('Error appending to Google Sheet:', error);
                    document.getElementById('error').innerText = 'Failed to log data to Google Sheet: ' + error.message;
                    reject(error);
                }
            });
        }

        function deleteRow(index) {
            filteredRows.splice(index, 1);
            renderTable();
        }

        function renderTable() {
            if (filteredRows.length === 0) {
                document.getElementById('report').innerHTML = '<p>No rows to display.</p>';
                return;
            }

            let tableHtml = `
                <table id="reportTable">
                    <thead>
                        <tr>
                            <th>ML/CIC</th>
                            <th>LP ID</th>
                            <th>LP Name</th>
                            <th>ALP Name</th>
                            <th>Sign On Time</th>
                            <th>Train No</th>
                            <th>LOCO No</th>
                            <th>Last Passed Station</th>
                            <th>Crew Entry Time</th>
                            <th>Total Duty Hours</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredRows.forEach((row, index) => {
                const dutyHours = calculateDutyHours(row[7]);
                const formattedDutyHours = formatDutyHours(dutyHours);
                tableHtml += `
                    <tr>
                        <td>${row[12] || ''}</td>
                        <td>${row[0] || ''}</td>
                        <td>${row[1] || ''}</td>
                        <td>${row[4] || ''}</td>
                        <td>${row[7] || ''}</td>
                        <td>${row[9] || ''}</td>
                        <td>${row[10] || ''}</td>
                        <td>${row[11] || ''}</td>
                        <td>${row[13] || ''}</td>
                        <td>${formattedDutyHours}</td>
                        <td><span class="delete-cross" onclick="deleteRow(${index})">✖</span></td>
                    </tr>
                `;
            });

            tableHtml += '</tbody></table>';
            document.getElementById('report').innerHTML = tableHtml;
        }

        async function generateReport() {
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = '';
            console.log('Starting report generation...');

            const tlcSelect = document.getElementById('tlcName').value;
            if (!tlcSelect) {
                errorDiv.innerText = 'Please select a TLC Name.';
                console.error('No TLC Name selected');
                return;
            }

            const fromDateTime = new Date(document.getElementById('fromDateTime').value);
            let toDateTime = new Date(document.getElementById('toDateTime').value);
            toDateTime.setSeconds(59, 999);
            console.log('Selected dates:', {
                fromDateTime: fromDateTime.toISOString(),
                toDateTime: toDateTime.toISOString(),
                currentDateTime: new Date().toISOString()
            });

            const mainLineChecked = document.getElementById('mainLineCheckbox').checked;
            const cicChecked = document.getElementById('cicCheckbox').checked;

            if (!fromDateTime || !toDateTime) {
                errorDiv.innerText = 'Please select both From and To dates.';
                console.error('Date selection error: Missing dates');
                return;
            }

            if (fromDateTime > toDateTime) {
                errorDiv.innerText = 'From Date cannot be later than To Date.';
                console.error('Date selection error: From date after To date');
                return;
            }

            if (!mainLineChecked && !cicChecked) {
                errorDiv.innerText = 'Please select at least one report type (Main Line or CIC).';
                console.error('No report type selected');
                return;
            }

            const data = await fetchSheetData();
            if (!data || data.length === 0) {
                errorDiv.innerText = 'No data found or failed to fetch data from Google Sheet.';
                console.error('No data fetched or empty sheet');
                return;
            }

            console.log('Processing data:', data.length, 'rows found');
            const headers = data[0];
            const rows = data.slice(1);

            filteredRows = rows.filter(row => {
                const crewEntryTime = parseCustomDate(row[13]);
                const signOff = row[22] ? row[22].trim() : '';
                const isValidSignOff = signOff === '' || signOff === null || signOff === undefined;
                const dutyHours = calculateDutyHours(row[7]);
                const mlCic = row[12] ? row[12].trim() : '';
                const isMainLine = mainLineChecked && (mlCic === 'SGRD-RIG-JSG' || mlCic === 'BSP-CPH-DIPKA' || mlCic === '');
                const isCic = cicChecked && (mlCic === 'CIC' || mlCic === '');
                const isValid = crewEntryTime && !isNaN(crewEntryTime) && 
                                crewEntryTime >= fromDateTime && crewEntryTime <= toDateTime && 
                                isValidSignOff && 
                                dutyHours > 9 && 
                                (isMainLine || isCic);
                console.log('Row filter:', { 
                    crewEntryTime: crewEntryTime?.toISOString(), 
                    signOff, 
                    isValidSignOff,
                    dutyHours: dutyHours.toFixed(2),
                    formattedDutyHours: formatDutyHours(dutyHours),
                    mlCic,
                    isMainLine,
                    isCic,
                    isValid,
                    row
                });
                return isValid;
            });

            console.log('Filtered rows:', filteredRows.length, filteredRows);
            if (filteredRows.length === 0) {
                errorDiv.innerText = 'No rows match the selected criteria.';
                console.warn('No rows after filtering');
                document.getElementById('report').innerHTML = '';
                return;
            }

            const sortOrder = ['BSP-CPH-DIPKA', 'SGRD-RIG-JSG', 'CIC', ''];
            filteredRows.sort((a, b) => {
                const aValue = a[12] ? a[12].trim() : '';
                const bValue = b[12] ? b[12].trim() : '';
                return sortOrder.indexOf(aValue) - sortOrder.indexOf(bValue);
            });

            renderTable();
        }

        async function printReport() {
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = '';

            if (filteredRows.length === 0) {
                errorDiv.innerText = 'No rows to print. Please generate a report first.';
                console.error('No rows to print');
                return;
            }

            if (!selectedTlcName) {
                errorDiv.innerText = 'Please select a TLC Name before printing.';
                console.error('No TLC Name selected for printing');
                return;
            }

            try {
                const timestamp = formatDate24(new Date());
                const tlcMobile = tlcData[selectedTlcName] || '';
                const fromDateTimeInput = document.getElementById('fromDateTime').value;
                const toDateTimeInput = document.getElementById('toDateTime').value;
                const fromDateTime = fromDateTimeInput ? formatDate24(new Date(fromDateTimeInput)) : '';
                const toDateTime = toDateTimeInput ? formatDate24(new Date(toDateTimeInput)) : '';

                await appendToSheet(timestamp, selectedTlcName, tlcMobile, fromDateTime, toDateTime);

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const heading = `COMBINED LONG HOURS MEMO  From: ${fromDateTime}  To: ${toDateTime}`;

                const headers = ['ML/CIC', 'LP ID', 'LP Name', 'ALP Name', 'Sign On Time', 'Train No', 'LOCO No', 'Last Passed Station', 'Crew Entry Time', 'Total Duty Hours'];
                const body = filteredRows.map(row => {
                    const dutyHours = calculateDutyHours(row[7]);
                    const formattedDutyHours = formatDutyHours(dutyHours);
                    return [
                        row[12] || '',
                        row[0] || '',
                        row[1] || '',
                        row[4] || '',
                        row[7] || '',
                        row[9] || '',
                        row[10] || '',
                        row[11] || '',
                        row[13] || '',
                        formattedDutyHours
                    ];
                });

                let currentPage = 1;
                let totalPages = 1;

                doc.autoTable({
                    head: [headers],
                    body: body,
                    startY: 15,
                    styles: { fontSize: 7, cellPadding: 1.5, lineWidth: 0.2, lineColor: [51, 51, 51] },
                    headStyles: { fillColor: [179, 215, 255], textColor: [0, 48, 135], lineWidth: 0.2, lineColor: [51, 51, 51] },
                    bodyStyles: { lineWidth: 0.2, lineColor: [51, 51, 51] },
                    alternateRowStyles: { fillColor: [245, 245, 245] },
                    margin: { top: 20, left: 5, right: 5, bottom: 20 },
                    columnStyles: {
                        0: { cellWidth: 23 },
                        1: { cellWidth: 15 },
                        2: { cellWidth: 25 },
                        3: { cellWidth: 25 },
                        4: { cellWidth: 20 },
                        5: { cellWidth: 15 },
                        6: { cellWidth: 15 },
                        7: { cellWidth: 20 },
                        8: { cellWidth: 20 },
                        9: { cellWidth: 15 }
                    },
                    didDrawPage: (data) => {
                        totalPages = doc.internal.getNumberOfPages();
                        doc.setFontSize(14);
                        doc.setTextColor('#003087');
                        doc.text(heading, 5, 10);
                        if (totalPages > 1 && currentPage === totalPages) {
                            const pageHeight = doc.internal.pageSize.height;
                            const signatureText = `Report Generated by:\n${selectedTlcName}`;
                            doc.text(signatureText, 190, pageHeight - 20, { align: 'right' });
                        }
                        currentPage++;
                    }
                });

                if (totalPages === 1) {
                    const pageHeight = doc.internal.pageSize.height;
                    const signatureText = `Report Generated by:\n${selectedTlcName}`;
                    doc.text(signatureText, 190, pageHeight - 20, { align: 'right' });
                }

                doc.save('Combined_Long_Hours_Memo.pdf');
                console.log('PDF generated and downloaded: Combined_Long_Hours_Memo.pdf');
            } catch (error) {
                errorDiv.innerText = 'Failed to generate PDF: ' + error.message;
                console.error('Error in printReport:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', populateTlcDropdown);
    </script>
</body>
</html>
