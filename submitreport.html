<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crew ID Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="submitreport.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">SUTRA LAST ENTRIES</h2>
        <form id="searchForm" class="mb-4">
            <div class="row g-3 align-items-center justify-content-center">
                <div class="col-auto">
                    <label for="crewId" class="form-label">Crew ID</label>
                </div>
                <div class="col-auto">
                    <input type="text" class="form-control" id="crewId" placeholder="e.g. BSP3637" required pattern=".{7,8}" title="LP ID must be like ex.BSP1234" oninput="this.value = this.value.toUpperCase().replace(/\s/g, '')">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </div>
        </form>
        <div id="loading" class="text-center" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading data...</p>
        </div>
        <div id="results" class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>LP ID</th>
                        <th>LP Name</th>
                        <th>ALP ID</th>
                        <th>ALP Name</th>
                        <th>Train No</th>
                        <th>LOCO No</th>
                        <th>Sign On Time</th>
                        <th>Last Passed Station</th>
                        <th>Time of Entry</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
            <div id="successMessage" class="text-center mt-3" style="display: none;">
                <p class="success-text">Your data has been submitted successfully, and action will be taken by TLC/CCC at the earliest.</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="submitreport.js"></script>
</body>
</html>
