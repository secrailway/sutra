<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Tabs</title>
    <link rel="stylesheet" href="yard.css">
</head>
<body>
    <div class="container">
        <h1>Division Tabs</h1>
        <div class="tabs"> 
            <button class="tab-button" onclick="toggleBilaspurTabs()">BILASPUR DIVISION</button>
            <button class="tab-button" onclick="openPDF('RAIPUR DIVISION.pdf')">RAIPUR DIVISION</button>
            <button class="tab-button" onclick="openPDF('SAMBALPUR DIVISION.pdf')">SAMBALPUR DIVISION</button>
        </div>

        <div id="bilaspur-tabs" class="sub-tabs hidden">
            <button class="sub-tab" onclick="openPDF('BSP-CPH.pdf')">BSP-CPH</button>
            <button class="sub-tab" onclick="openPDF('CPH-DPK.pdf')">CPH-DPK</button>
            <button class="sub-tab" onclick="openPDF('CPH-RIG.pdf')">CPH-RIG</button>
            <button class="sub-tab" onclick="openPDF('RIG-IB.pdf')">RIG-IB</button>
            <button class="sub-tab" onclick="openPDF('KHS-KURUMKELA.pdf')">KHS-KURUMKELA</button>
            <button class="sub-tab" onclick="openPDF('USL-PND.pdf')">USL-PND</button>
            <button class="sub-tab" onclick="openPDF('PND-SDL.pdf')">PND-SDL</button>
            <button class="sub-tab" onclick="openPDF('SDL-JLW.pdf')">SDL-JLW</button>
            <button class="sub-tab" onclick="openPDF('APR-BJRI.pdf')">APR-BJRI</button>
            <button class="sub-tab" onclick="openPDF('BJRI-SJQ.pdf')">BJRI-SJQ</button>
            <button class="sub-tab" onclick="openPDF('SJQ-ABKP.pdf')">SJQ-ABKP</button>
        </div>

        <!-- Add a container for embedding the PDF -->
        <div id="pdf-viewer" style="display: none; width: 100%; height: 500px;"></div>
    </div>

    <script>
        function openPDF(pdfName) {
            // Detect if the user is on a mobile device
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

            if (isMobile) {
                // For mobile: Embed the PDF in an iframe to force viewing
                const viewer = document.getElementById('pdf-viewer');
                viewer.style.display = 'block'; // Show the viewer
                viewer.innerHTML = `<iframe src="${pdfName}" width="100%" height="100%" style="border: none;"></iframe>`;
            } else {
                // For PC: Open in a new tab
                window.open(pdfName + '#toolbar=1&navpanes=0&scrollbar=1', '_blank');
            }
        }

        function toggleBilaspurTabs() {
            const tabs = document.getElementById('bilaspur-tabs');
            tabs.classList.toggle('hidden');
        }
    </script>
</body>
</html>
