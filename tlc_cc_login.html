<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TLC & CC Operations Console</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<style>
		@import url('https://fonts.googleapis.com/css?family=Montserrat:400,800');

		* {
			box-sizing: border-box;
		}

		body {
			background: #f6f5f7;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			font-family: 'Montserrat', sans-serif;
			height: 100vh;
			margin: -20px 0 50px;
		}

		h1 {
			font-weight: bold;
			margin: 0;
		}

		h2 {
			text-align: center;
		}

		p {
			font-size: 14px;
			font-weight: 100;
			line-height: 20px;
			letter-spacing: 0.5px;
			margin: 20px 0 30px;
		}

		span {
			font-size: 12px;
		}

		a {
			color: #333;
			font-size: 14px;
			text-decoration: none;
			margin: 15px 0;
		}

		button {
			border-radius: 20px;
			border: 1px solid #FF4B2B;
			background-color: #FF4B2B;
			color: #FFFFFF;
			font-size: 12px;
			font-weight: bold;
			padding: 12px 45px;
			letter-spacing: 1px;
			text-transform: uppercase;
			transition: transform 80ms ease-in;
		}

		button:active {
			transform: scale(0.95);
		}

		button:focus {
			outline: none;
		}

		button.ghost {
			background-color: transparent;
			border-color: #FFFFFF;
		}

		form {
			background-color: #FFFFFF;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 50px;
			height: 100%;
			text-align: center;
		}

		input {
			background-color: #eee;
			border: none;
			padding: 12px 15px;
			margin: 8px 0;
			width: 100%;
			text-transform: uppercase;
		}

		.container {
			background-color: #fff;
			border-radius: 10px;
			box-shadow: 0 14px 28px rgba(0,0,0,0.25), 
				0 10px 10px rgba(0,0,0,0.22);
			position: relative;
			overflow: hidden;
			width: 768px;
			max-width: 100%;
			min-height: 480px;
		}

		.form-container {
			position: absolute;
			top: 0;
			height: 100%;
			transition: all 0.6s ease-in-out;
		}

		.sign-in-container {
			left: 0;
			width: 50%;
			z-index: 2;
		}

		.container.right-panel-active .sign-in-container {
			transform: translateX(100%);
		}

		.sign-up-container {
			left: 0;
			width: 50%;
			opacity: 0;
			z-index: 1;
		}

		.container.right-panel-active .sign-up-container {
			transform: translateX(100%);
			opacity: 1;
			z-index: 5;
			animation: show 0.6s;
		}

		@keyframes show {
			0%, 49.99% {
				opacity: 0;
				z-index: 1;
			}
			
			50%, 100% {
				opacity: 1;
				z-index: 5;
			}
		}

		.overlay-container {
			position: absolute;
			top: 0;
			left: 50%;
			width: 50%;
			height: 100%;
			overflow: hidden;
			transition: transform 0.6s ease-in-out;
			z-index: 100;
		}

		.container.right-panel-active .overlay-container {
			transform: translateX(-100%);
		}

		.overlay {
			background: #FF416C;
			background: -webkit-linear-gradient(to right, #FF4B2B, #FF416C);
			background: linear-gradient(to right, #FF4B2B, #FF416C);
			background-repeat: no-repeat;
			background-size: cover;
			background-position: 0 0;
			color: #FFFFFF;
			position: relative;
			left: -100%;
			height: 100%;
			width: 200%;
			transform: translateX(0);
			transition: transform 0.6s ease-in-out;
		}

		.container.right-panel-active .overlay {
			transform: translateX(50%);
		}

		.overlay-panel {
			position: absolute;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 0 40px;
			text-align: center;
			top: 0;
			height: 100%;
			width: 50%;
			transform: translateX(0);
			transition: transform 0.6s ease-in-out;
		}

		.overlay-left {
			transform: translateX(-20%);
		}

		.container.right-panel-active .overlay-left {
			transform: translateX(0);
		}

		.overlay-right {
			right: 0;
			transform: translateX(0);
		}

		.container.right-panel-active .overlay-right {
			transform: translateX(20%);
		}

		footer {
		    background-color: #222;
		    color: #fff;
		    font-size: 14px;
		    bottom: 0;
		    position: fixed;
		    left: 0;
		    right: 0;
		    text-align: center;
		    z-index: 999;
		}

		footer p {
		    margin: 10px 0;
		}

		footer i {
		    color: red;
		}

		footer a {
		    color: #3c97bf;
		    text-decoration: none;
		}
	</style>
</head>
<body>
	<h1>TLC & CC Operations Console</h1>
	<div class="container" id="container">
		<div class="form-container sign-up-container">
			<form id="ccForm">
				<h1>Login - CC Long Hours</h1>
				<input type="text" id="ccLoginID" placeholder="Login ID" style="text-transform: uppercase;" required />
				<input type="password" id="ccPassword" placeholder="Password" required />
				<button type="submit">Login</button>
			</form>
		</div>
		<div class="form-container sign-in-container">
			<form id="tlcForm">
				<h1>Login - TLC</h1>
				<input type="text" id="tlcLoginID" placeholder="Login ID" style="text-transform: uppercase;" required />
				<input type="password" id="tlcPassword" placeholder="Password" required />
				<button type="submit">Login</button>
			</form>
		</div>
		<div class="overlay-container">
			<div class="overlay">
				<div class="overlay-panel overlay-left">
					<h1>Welcome CC Long Hours</h1>
					<p>Your slight effort can lighten the load of long hours for Bilaspur Division</p>
					<button class="ghost" id="signIn">TLC Login</button>
				</div>
				<div class="overlay-panel overlay-right">
					<h1>Welcome TLC</h1>
					<p>Your slight effort can lighten the load of long hours for Bilaspur Division</p>
					<button class="ghost" id="signUp">CC Login</button>
				</div>
			</div>
		</div>
	</div>
	<footer>
		<p>
			Created with <i class="fa fa-heart"></i> by You
		</p>
	</footer>

	<script>
		const signUpButton = document.getElementById('signUp');
		const signInButton = document.getElementById('signIn');
		const container = document.getElementById('container');
		const tlcForm = document.getElementById('tlcForm');
		const ccForm = document.getElementById('ccForm');

		// Function to generate a simple UUID
		function generateToken() {
			return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
				const r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
				return v.toString(16);
			});
		}

		signUpButton.addEventListener('click', () => {
			container.classList.add("right-panel-active");
		});

		signInButton.addEventListener('click', () => {
			container.classList.remove("right-panel-active");
		});

		// TLC Login Validation
		tlcForm.addEventListener('submit', (e) => {
			e.preventDefault();
			const loginID = document.getElementById('tlcLoginID').value.toUpperCase();
			const password = document.getElementById('tlcPassword').value;

			if (loginID === 'TLCLH' && password === 'TLCLH@321') {
				const token = generateToken();
				localStorage.setItem('tlcToken', token);
				window.location.href = `TLC.html?token=${token}`;
			} else {
				alert('Invalid TLC Login ID or Password');
			}
		});

		// CC Long Hours Login Validation
		const ccCredentials = {
			"AKT": "1575",
			"BJRI": "1593",
			"BRJN": "5040",
			"BSP": "1317",
			"KHS": "1944",
			"KRBA": "2715",
			"PND": "1428",
			"RIG": "2213",
			"SDL": "2520",
			"SJQ": "1680",
			"USL": "2331",
			"Admin": "1234"
		};

		ccForm.addEventListener('submit', (e) => {
			e.preventDefault();
			const loginID = document.getElementById('ccLoginID').value.toUpperCase();
			const password = document.getElementById('ccPassword').value;

			if (ccCredentials[loginID] && ccCredentials[loginID] === password) {
				const token = generateToken();
				localStorage.setItem('ccToken', token);
				window.location.href = `CCC.html?token=${token}`;
			} else {
				alert('Invalid CC Long Hours Login ID or Password');
			}
		});
	</script>
</body>
</html>
